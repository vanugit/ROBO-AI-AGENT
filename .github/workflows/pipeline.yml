name: Build, Test, Stage, Prod Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # STAGE 1: BUILD
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Verify Python syntax
        run: python -m py_compile server.py

      - name: Package application files
        uses: actions/upload-artifact@v7
        with:
          name: robo-app-bundle
          path: |
            server.py
            index.html
            app.js
            explorations.js
            styles.css
            robo-icon.ico
            Procfile
            requirements.txt

  # STAGE 2: TEST (Runs only if Build succeeds)
  test:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies (if any)
        run: |
          if [ -s requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run unit tests
        run: python -m unittest discover -s tests

  # STAGE 3: STAGE (Runs only if Test succeeds)
  deploy-stage:
    needs: test
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: robo-app-bundle

      - name: Trigger Staging Deployment
        run: |
          echo "Deploying to Staging environment..."
          # Uncomment the line below once you add STAGE_DEPLOY_HOOK in GitHub Secrets:
          # curl -X POST ${{ secrets.STAGE_DEPLOY_HOOK }}

  # STAGE 4: PRODUCTION (Pauses for manual approval after Stage succeeds)
  deploy-prod:
    needs: deploy-stage
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: robo-app-bundle

      - name: Trigger Production Deployment
        run: |
          echo "Deploying to Production environment..."
          # Uncomment the line below once you add PROD_DEPLOY_HOOK in GitHub Secrets:
          # curl -X POST ${{ secrets.PROD_DEPLOY_HOOK }}
